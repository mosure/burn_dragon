# overrides for vision_saccade_tiny integration test

[dataset]
max_records = 64

[training]
max_iters = 2
log_frequency = 2
trace_train_loss = true
trace_train_loss_every = 8
memory_cleanup_iters = 25

[mode]
artifact_every = 0

[test.integration]
skip_gpu_util = false
gpu_util_interval_ms = 250
gpu_util_timeout_secs = 1800
gpu_util_warmup_samples = 4
min_train_loss = 0.05
max_train_loss = 10.0
min_gpu_util = 70.0
max_mem_growth_mb = 8192.0
