# Fused WGPU launch overrides for full ImageNet-1k multimode spatial training.
# Keeps the effective batch size constant while enabling the stage-aware pyramid executor.

[dataset]
prefetch_batches = 2
prefetch_workers = 8
prefetch_to_device = false

[training]
batch_size = 32
gradient_accumulation_steps = 8
log_frequency = 25
device_memory_check_every = 5
max_device_memory_mb = 98304

[vision]
fused_kernels = true

[wgpu.training]
fused_core_recurrent = true
fused_core_rollout = true
