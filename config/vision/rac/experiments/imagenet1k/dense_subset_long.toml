extends = ["../../base.toml"]

[dataset]
source = "imagenet"
imagenet_root = "data/imagenet1k"
train_dir = "train"
val_dir = "val"
max_records = 16384
prefetch_batches = 8
prefetch_workers = 8
prefetch_to_device = true
cache_decoded = true
cache_capacity = 512
cache_preprocessed = false

[training]
schedule_mode = "epochs"
epochs = 8
max_iters = 8192
batch_size = 16
log_frequency = 256
device_memory_check_every = 32
max_device_memory_mb = 92160
rollout_min_steps = 3
rollout_max_steps = 3
rollout_backprop_steps = 2

[optimizer]
learning_rate = 0.0003
weight_decay = 0.02
grad_clip_norm = 1.0

[optimizer.lr_schedule]
type = "cosine"
min_lr = 0.00003
num_iters = 8192

[vision]
image_size = 128
patch_size = 8
backbone = "dense"
in_channels = 3
embed_dim = 96
steps = 4
n_head = 4
mlp_internal_dim_multiplier = 4
dropout = 0.0
projection_dim = 128
projection_hidden_dim = 256
use_cls_token = true
token_state_norm = true
pos_encoding = "rope"
attention_mode = "row_l1"
fused_kernels = false
relu_threshold = 0.0

[vision.rho_stream]
enabled = false
local_radius = 1
local_diagonals = true
local_self = true
decay = 0.985
mode_embeddings = false
wgpu_forward_kernel = false
wgpu_rollout_fused = false

[mode]
sample_steps = 8
random_time_grid = true
state_channels = 3
velocity_hidden_dim = 128
artifact_output = "images"
artifact_fps = 6
artifact_every = 1
artifact_max_images = 4
artifact_upscale = 2
artifact_overwrite = false

[mode.teacher]
kind = "pooled_image"
latent_downsample = 8

[mode.memory]
observe_steps = 2
backprop_steps = 2
reset_each_step = false

[mode.loss]
recon_weight = 1.0
path_weight = 0.25
latent_weight = 0.5
roundtrip_weight = 0.5
velocity_weight = 0.1
probe_weight = 0.05

[augment]
image_size = 128
resize_short = 146
min_scale = 0.8
max_scale = 1.0
min_aspect_ratio = 0.9
max_aspect_ratio = 1.1112
flip_prob = 0.5
color_jitter_prob = 0.0
brightness = 0.0
contrast = 0.0
saturation = 0.0
hue = 0.0
grayscale_prob = 0.0
blur_prob = 0.0
blur_sigma_min = 0.1
blur_sigma_max = 2.0
solarize_prob = 0.0
solarize_threshold = 128
normalize_mean = [0.0, 0.0, 0.0]
normalize_std = [1.0, 1.0, 1.0]
