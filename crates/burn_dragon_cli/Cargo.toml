[package]
name = "burn_dragon_cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
description = "CLI for burn_dragon"
homepage = "https://github.com/mosure/burn_bdh"
repository = "https://github.com/mosure/burn_bdh"
readme = "../../README.md"
default-run = "infer"

[features]
default = ["cli", "cuda"]
cli = ["train", "burn_dragon/cli"]
ddp = ["train", "burn_dragon/ddp", "dep:burn-collective", "dep:tokio"]
language-train = [
  "dep:burn_dragon_language",
  "dep:burn_dragon_reasoning",
  "burn_dragon_language/train",
  "dep:burn_dragon_train",
  "burn_dragon_train/train",
  "burn_dragon_train/cli",
]
language-probe = [
  "language-train",
  "burn_dragon/probe",
  "burn_dragon_language/probe",
]
language-universality = [
  "dep:burn_dragon_universality",
]
language-ddp = [
  "language-train",
  "burn_dragon_language/ddp",
  "burn_dragon_train/ddp",
  "dep:burn-collective",
  "dep:tokio",
]
language-cuda = [
  "language-train",
  "dep:burn-cuda",
  "burn_dragon_language/cuda",
  "burn_dragon_train/cuda",
]
language-rerun = [
  "language-train",
  "burn_dragon_language/rerun",
]
train = ["burn_dragon/train", "dep:burn_dragon_sudoku", "burn_dragon_sudoku/train"]
cuda = ["dep:burn-cuda", "burn_dragon/cuda", "burn_dragon_sudoku/cuda"]
viz = ["burn_dragon/viz", "dep:ctrlc", "dep:bevy_burn"]
web = ["burn_dragon/web"]
benchmark = ["burn_dragon/benchmark"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
rand = "0.8"
burn = { version = "0.21.0-pre.2", default-features = false, features = ["ndarray", "std", "wgpu", "fusion"] }
burn-autodiff = "0.21.0-pre.2"
burn-wgpu = { version = "0.21.0-pre.2", default-features = false, features = ["fusion", "std"] }
burn-ndarray = "0.21.0-pre.2"
bevy_burn = { version = "0.4", optional = true }
ctrlc = { version = "3.4", optional = true }
burn-cuda = { version = "0.21.0-pre.2", optional = true, default-features = false, features = ["std"] }
burn-collective = { version = "0.21.0-pre.2", optional = true, features = ["orchestrator"] }
burn_dragon = { path = "../..", version = "0.5.0", default-features = false }
burn_dragon_language = { path = "../burn_dragon_language", version = "0.5.0", default-features = false, optional = true }
burn_dragon_reasoning = { path = "../burn_dragon_reasoning", version = "0.5.0", default-features = false, optional = true }
burn_dragon_train = { path = "../burn_dragon_train", version = "0.5.0", default-features = false, optional = true }
burn_dragon_universality = { path = "../burn_dragon_universality", version = "0.5.0", default-features = false, optional = true }
burn_dragon_kernel = { path = "../burn_dragon_kernel", version = "0.5.0", default-features = false }
burn_dragon_sudoku = { path = "../burn_dragon_sudoku", version = "0.5.0", default-features = false, optional = true }
pollster = "0.3"
tokio = { version = "1.49.0", optional = true, features = ["rt-multi-thread"] }
wgpu = "26"
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "core_mhc_bench"
path = "src/bin/core_mhc_bench.rs"
required-features = ["benchmark"]

[[bin]]
name = "core_mhc_fb_bench"
path = "src/bin/core_mhc_fb_bench.rs"
required-features = ["benchmark"]

