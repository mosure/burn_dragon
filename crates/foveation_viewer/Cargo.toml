[package]
name = "foveation_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bevy-inspector-egui = "0.35"
bevy_egui = "0.38"
bevy_burn = "0.4"
bevy = { version = "0.17", default-features = false, features = [
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_image",
  "bevy_log",
  "bevy_render",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
] }
bevy_shader = "0.17"
burn = { version = "0.19", default-features = false, features = ["std", "wgpu"] }
burn-wgpu = { version = "0.19", default-features = false, features = ["std"] }
burn_dragon_hatchling_core = { path = "../burn_dragon_hatchling_core", default-features = false, features = ["train"] }
burn_dragon_hatchling_vision = { path = "../burn_dragon_hatchling_vision", default-features = false, features = ["train"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
noise = "0.9"
wgpu = "26"

[dev-dependencies]
pollster = "0.3"
