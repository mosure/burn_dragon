[package]
name = "burn_dragon"
description = "burn dragon inference and training"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = [
  "burn",
  "bdh",
  "language-model",
  "machine-learning",
]
categories = [
  "compression",
  "science",
  "science::neuroscience",
]
homepage = "https://github.com/mosure/burn_bdh"
repository = "https://github.com/mosure/burn_bdh"
readme = "README.md"
exclude = [
  ".devcontainer",
  ".github",
  "docs",
  "dist",
  "build",
  "assets",
  "credits",
]

[workspace]
members = [
  ".",
  "crates/bevy_dragon",
  "crates/burn_autogaze",
  "crates/burn_vjepa",
  "crates/burn_dragon_checkpoint",
  "crates/burn_dragon_core",
  "crates/burn_dragon_cli",
  "crates/burn_dragon_dreamer",
  "crates/burn_dragon_language",
  "crates/burn_dragon_multimodal",
  "crates/burn_dragon_reasoning",
  "crates/burn_dragon_sudoku",
  "crates/burn_dragon_stream",
  "crates/burn_dragon_train",
  "crates/burn_dragon_kernel",
  "crates/burn_dragon_universality",
  "crates/burn_dragon_vision",
  "crates/burn_dragon_web",
  "crates/burn_dragon_fovea_viewer",
  "crates/burn_dragon_graph",
]

[features]
default = ["cli", "cuda"]

benchmark = [
  "train",
  "burn_dragon_core/benchmark",
  "burn_dragon_graph/benchmark",
  "burn_dragon_sudoku/benchmark",
  "burn_dragon_train/benchmark",
  "burn_dragon_vision/benchmark",
]
probe = [
  "burn_dragon_core/probe",
  "burn_dragon_language/probe",
  "burn_dragon_multimodal/probe",
]
cli = [
  "train",
  "burn_dragon_train/cli",
  "burn_dragon_vision/cli",
]
ddp = ["train", "burn_dragon_train/ddp", "burn_dragon_language/ddp"]
train = [
  "burn_dragon_core/train",
  "burn_dragon_language/train",
  "burn_dragon_multimodal/train",
  "burn_dragon_sudoku/train",
  "burn_dragon_train/train",
  "burn_dragon_vision/train",
]
cuda = [
  "burn_dragon_core/cuda",
  "burn_dragon_language/cuda",
  "burn_dragon_sudoku/cuda",
  "burn_dragon_train/cuda",
  "burn_dragon_vision/cuda",
]
integration_test = [
  "train",
  "burn_dragon_train/integration_test",
  "burn_dragon_vision/integration_test",
]
web = ["burn_dragon_core/web", "burn_dragon_language/web", "burn_dragon_web"]
viz = [
  "burn_dragon_core/viz",
  "burn_dragon_language/viz",
  "burn_dragon_multimodal/viz",
  "bevy_dragon/viz",
  "bevy_dragon",
]


[dependencies]
burn_dragon_core = { path = "crates/burn_dragon_core", version = "0.5.0", default-features = false }
burn_dragon_checkpoint = { path = "crates/burn_dragon_checkpoint", version = "0.5.0", default-features = false }
burn_dragon_graph = { path = "crates/burn_dragon_graph", version = "0.5.0", default-features = false }
burn_dragon_language = { path = "crates/burn_dragon_language", version = "0.5.0", default-features = false }
burn_dragon_multimodal = { path = "crates/burn_dragon_multimodal", version = "0.5.0", default-features = false }
burn_dragon_sudoku = { path = "crates/burn_dragon_sudoku", version = "0.5.0", default-features = false }
burn_dragon_stream = { path = "crates/burn_dragon_stream", version = "0.5.0", default-features = false }
burn_dragon_train = { path = "crates/burn_dragon_train", version = "0.5.0", default-features = false, optional = true }
burn_dragon_vision = { path = "crates/burn_dragon_vision", version = "0.5.0", default-features = false }
burn_dragon_kernel = { path = "crates/burn_dragon_kernel", version = "0.5.0", default-features = false }
burn_dragon_universality = { path = "crates/burn_dragon_universality", version = "0.5.0", default-features = false }
bevy_dragon = { path = "crates/bevy_dragon", version = "0.5.0", default-features = false, optional = true }
burn_dragon_web = { path = "crates/burn_dragon_web", version = "0.5.0", default-features = false, optional = true }


[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
burn = { version = "0.21.0-pre.2", default-features = false, features = ["fusion", "ndarray", "std", "wgpu"] }
burn-autodiff = { version = "0.21.0-pre.2" }
burn-ndarray = "0.21.0-pre.2"
burn-wgpu = { version = "0.21.0-pre.2", default-features = false, features = ["fusion", "std"] }
burn-cuda = { version = "0.21.0-pre.2", default-features = false, features = ["std"] }
bytemuck = { version = "1", features = ["derive"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tempfile = "3"
wgpu = "26"


[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.bench]
inherits = "release"
lto = "off"
codegen-units = 16
debug = 0

[profile.wasm-release]
strip = "symbols"
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[patch.crates-io]
cubecl-cuda = { path = "vendor/cubecl-cuda-0.10.0-pre.2" }
burn-collective = { path = "vendor/burn-collective-0.21.0-pre.2" }


[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bench]]
name = "inference"
harness = false
path = "bench/inference.rs"

[[bench]]
name = "train"
harness = false
path = "bench/train.rs"

[[bench]]
name = "vision_pipeline"
harness = false
path = "bench/vision_pipeline.rs"

[[bench]]
name = "vision_train_step"
harness = false
path = "bench/vision_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_mae_train_step"
harness = false
path = "bench/vision_mae_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_lejepa_train_step"
harness = false
path = "bench/vision_lejepa_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_input_projection"
harness = false
path = "bench/vision_input_projection.rs"
required-features = ["benchmark"]
