[dataset]
cache_dir = "data/sudoku"
train_split_ratio = 0.9
type = "hugging_face"
repo_id = "Ritvik19/Sudoku-Dataset"
format = "parquet"
train_files = ["train_0.parquet"]
validation_files = ["valid_0.parquet"]
puzzle_field = "puzzle"
solution_field = "solution"
max_records = 100000

[training]
batch_size = 64
max_iters = 2000
log_frequency = 50
rollout_steps = 16
halt_weight = 0.1
policy_noise = 0.4

[training.gdpo]
enabled = true
group_size = 2
hard_weight = 1.0
easy_weight = 1.0
policy_weight = 1.0
policy_clip_range = 0.2

[optimizer]
learning_rate = 0.001
weight_decay = 0.01

[model]
n_layer = 6
n_embd = 256
n_head = 4
mlp_internal_dim_multiplier = 4
dropout = 0.1

[artifacts]
output = "mp4"
fps = 8
max_samples = 8
overwrite = true
