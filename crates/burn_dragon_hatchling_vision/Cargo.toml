[package]
name = "burn_dragon_hatchling_vision"
description = "Foveation and vision sampling utilities for burn dragon hatchling"
version = "0.3.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = ["vision", "foveation", "sampling", "burn"]
categories = ["science", "science::neuroscience"]
readme = "../../README.md"

[features]
default = []

benchmark = ["train", "burn_dragon_hatchling_core/benchmark"]
cli = ["train", "dep:clap", "dep:ctrlc", "burn_dragon_hatchling_core/cli"]
train = [
  "burn_dragon_hatchling_core/train",
  "dep:anyhow",
  "dep:burn",
  "dep:burn-autodiff",
  "dep:burn-ndarray",
  "dep:burn-train",
  "dep:burn-wgpu",
  "dep:burn-cubecl",
  "dep:burn-fusion",
  "dep:cubecl",
  "dep:cubecl-runtime",
  "dep:names",
  "dep:toml",
  "dep:ureq",
  "dep:hf-hub",
  "dep:csv",
  "dep:parquet",
  "dep:tracing",
  "dep:image",
  "dep:flate2",
  "dep:tar",
  "dep:burn_dino",
  "dep:serde",
  "dep:serde_json",
  "dep:rand",
]
cuda = ["dep:burn-cuda", "burn_dragon_hatchling_core/cuda"]
integration_test = ["train", "burn_dragon_hatchling_core/integration_test"]

[dependencies]
burn_dragon_hatchling_core = { path = "../burn_dragon_hatchling_core", default-features = false }
anyhow = { version = "1", optional = true }
burn = { version = "0.19", default-features = false, optional = true, features = ["fusion", "ndarray", "std", "wgpu"] }
burn-autodiff = { version = "0.19", optional = true }
burn-ndarray = { version = "0.19", optional = true }
burn-train = { version = "0.19", optional = true, default-features = false, features = ["tui"] }
burn-wgpu = { version = "0.19", default-features = false, optional = true, features = ["fusion", "std", "template"] }
burn-cubecl = { version = "0.19", default-features = false, optional = true, features = ["std", "fusion"] }
burn-fusion = { version = "0.19", default-features = false, optional = true, features = ["std"] }
burn-cuda = { version = "0.19", optional = true, default-features = false, features = ["std"] }
cubecl = { version = "0.8", default-features = true, optional = true, features = ["std"] }
cubecl-runtime = { version = "0.8", default-features = true, optional = true, features = ["channel-mpsc", "std"] }
names = { version = "0.14", optional = true }
toml = { version = "0.9", optional = true }
ureq = { version = "2.9", features = ["tls"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
csv = { version = "1.3", optional = true }
parquet = { version = "53", optional = true }
tracing = { version = "0.1", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
flate2 = { version = "1.1", optional = true }
tar = { version = "0.4", optional = true }
burn_dino = { version = "0.6", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
rand = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.4", optional = true }
