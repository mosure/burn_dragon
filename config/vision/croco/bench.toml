# benchmark overrides for vision/croco/tiny

[mode]
artifact_every = 0

[bench]
include_cuda = false
include_wgpu = false

[dataset]
max_records = 32

[training]
batch_size = 1
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 2

[vision]
image_size = 64
patch_size = 16
embed_dim = 64
steps = 2
n_head = 2
mlp_internal_dim_multiplier = 2
projection_dim = 64
projection_hidden_dim = 128

[mode.loss.recon]
hidden_dim = 128

[augment]
image_size = 64
resize_short = 64

