[package]
edition = "2021"
name = "bevy_burn"
version = "0.4.9"
authors = ["mosure <mitchell@mosure.me>"]
build = false
exclude = [
    ".devcontainer",
    ".github",
    "docs",
    "dist",
    "build",
    "assets",
    "credits",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "bevy burn bindings"
homepage = "https://github.com/mosure/bevy_burn"
readme = "README.md"
keywords = [
    "bevy",
    "burn",
    "machine-learning",
    "compute-shader",
]
categories = [
    "computer-vision",
    "graphics",
    "rendering",
]
license = "MIT"
repository = "https://github.com/mosure/bevy_burn"

[lib]
name = "bevy_burn"
path = "src/lib.rs"

[[example]]
name = "gpu_interop"
path = "example/gpu_interop.rs"

[[example]]
name = "navier_stokes"
path = "example/navier_stokes.rs"

[[bench]]
name = "io"
path = "bench/io.rs"
harness = false

[dependencies.bevy]
version = "0.17"
features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "debug",
    "default_font",
    "png",
    "std",
    "tonemapping_luts",
    "webgpu",
    "x11",
    "zstd_rust",
]
default-features = false

[dependencies.burn]
version = "0.19"
features = ["std"]
default-features = false

[dependencies.burn-core]
version = "0.19"

[dependencies.burn-cubecl]
version = "0.19"
default-features = false

[dependencies.burn-cubecl-fusion]
version = "0.19"
features = ["std"]
default-features = false

[dependencies.burn-wgpu]
version = "0.19"
features = ["fusion"]
default-features = false

[dependencies.bytemuck]
version = "1.23"

[dependencies.wgpu]
version = "26.0"

[dev-dependencies.futures]
version = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.criterion]
version = "0.7"
features = ["html_reports"]

[target.'cfg(target_arch = "wasm32")'.dependencies.console_error_panic_hook]
version = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "Location",
    "Node",
    "Window",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.wasm-release]
opt-level = "z"
lto = "fat"
codegen-units = 1
inherits = "release"
