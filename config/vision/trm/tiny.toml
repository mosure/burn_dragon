# tiny TRM training config (graph-structured BDH residual stream)

[dataset]
imagenet_root = "data/imagenette2-160"
train_dir = "train"
val_dir = "val"
prefetch_batches = 8
prefetch_workers = 6
prefetch_to_device = true
cache_decoded = true
cache_capacity = 512
cache_preprocessed = true

[dataset.download]
type = "imagenette"
variant = "imagenette2-160"

[training]
batch_size = 64
max_iters = 20000
log_frequency = 200
rollout_min_steps = 2
rollout_max_steps = 6
rollout_backprop_steps = 6

[optimizer]
learning_rate = 0.0005
weight_decay = 0.05
grad_clip_norm = 1.0

[optimizer.lr_schedule]
type = "constant"

[vision]
image_size = 224
patch_size = 8
in_channels = 3
embed_dim = 256
steps = 6
n_head = 4
mlp_internal_dim_multiplier = 4
dropout = 0.1
projection_dim = 384
projection_hidden_dim = 512
use_cls_token = true
pos_encoding = "learned2d"
attention_mode = "row_l1"
fused_kernels = false
relu_threshold = 0.0

[vision.trm_graph]
enabled = true
coarse_stride = 2
hub_count = 8
rank = 8
value_dim = 64
local_radius = 1
local_diagonals = true
local_self = true
decay = 0.9
hub_gates = true
# Local 96x96 crops do not match the 224x224 TRM grid; opt into explicit fallback.
grid_mismatch_policy = "fallback_default"

[mode]
type = "lejepa"
# total number of views when global_views/local_views are 0
views = 4
# enable multi-crop when > 0 (global views use base augmentations)
global_views = 2
# local views use local_* crop settings below
local_views = 2
local_image_size = 96
local_min_scale = 0.05
local_max_scale = 0.3
# enforce some overlap between global views when possible
min_view_overlap = 0.2
view_overlap_attempts = 8
# write artifact images every N validation iterations (0 disables)
artifact_every = 1
# artifact output: images (png), avi, or mp4
artifact_output = "mp4"
# artifact video fps (frames per second)
artifact_fps = 8
# max images per artifact batch (caps batch rows)
artifact_max_images = 4
# max views per image (caps number of crops shown)
artifact_max_views = 3
# overwrite validation artifacts instead of keeping history
artifact_overwrite = false

[mode.loss.lejepa]
enabled = true
lambda = 0.02
sigreg_knots = 17
sigreg_t_max = 3.0
sigreg_proj_dim = 256

[mode.loss.recon]
weight = 1.0
# fraction of patches to mask for the MAE-style reconstruction loss
mask_ratio = 0.6
loss_on_all_patches = false
recon_head_norm = true
hidden_dim = 256

[augment]
image_size = 224
resize_short = 256
min_scale = 0.08
max_scale = 1.0
min_aspect_ratio = 0.75
max_aspect_ratio = 1.3333334
flip_prob = 0.5
color_jitter_prob = 1.0
brightness = 0.4
contrast = 0.4
saturation = 0.0
hue = 0.1
grayscale_prob = 0.0
blur_prob = 0.0
blur_sigma_min = 0.1
blur_sigma_max = 2.0
solarize_prob = 0.0
solarize_threshold = 128
normalize_mean = [0.485, 0.456, 0.406]
normalize_std = [0.229, 0.224, 0.225]
