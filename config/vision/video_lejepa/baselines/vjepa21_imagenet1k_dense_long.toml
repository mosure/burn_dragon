[run_layout]
category = "video_lejepa/vjepa21/imagenet1k"
mirror_config_path = false

[dataset]
source = "imagenet"
imagenet_root = "data/imagenet1k"
train_dir = "train"
val_dir = "val"
prefetch_batches = 2
prefetch_workers = 4
prefetch_to_device = false
cache_decoded = true
cache_capacity = 2048
cache_preprocessed = false

[training]
batch_size = 64
schedule_mode = "max_iters"
epochs = 1
max_iters = 2000
log_frequency = 100
enable_checkpoints = true

[optimizer]
learning_rate = 0.00015
weight_decay = 0.05

[optimizer.lr_schedule]
type = "cosine"
min_lr = 0.00001

[vision]
backbone = "dense"
image_size = 224
patch_size = 16
in_channels = 3
embed_dim = 192
steps = 8
n_head = 6
mlp_internal_dim_multiplier = 4
dropout = 0.0
projection_dim = 96
projection_hidden_dim = 256
use_cls_token = true
cls_sync_alpha = 0.0
num_eyes = 1
cross_eye_steps = 0
token_state_norm = true
pos_encoding = "rope"
attention_mode = "row_l1"
use_alibi = false
fused_kernels = false

[mode]
type = "video_lejepa"
paradigm = "vjepa_2_1"
frame_stride = 1
artifact_every = 0
artifact_max_images = 0
artifact_output = "mp4"
artifact_fps = 6
artifact_overwrite = true

[mode.vjepa21]
clip_frames = 2
observe_steps = 1
observe_backprop_steps = 1
predictor_hidden_dim = 384
use_mask_token_bias = true
checkpoint_depths = [2, 4, 8]

[mode.vjepa21.teacher_ema]
enabled = true
decay = 0.996

[mode.vjepa21.mask]
spatial_scale_min = 0.2
spatial_scale_max = 0.7
temporal_scale_min = 1.0
temporal_scale_max = 1.0
aspect_ratio_min = 0.5
aspect_ratio_max = 2.0
num_blocks = 4
max_context_frames_ratio = 1.0

[mode.vjepa21.loss]
masked_weight = 1.0
context_weight = 0.25
predict_all = true
weight_distance_loss = true
offset_context_loss = false
normalize_targets = true
loss_exp = 1.0

[mode.loss]
probe_weight = 0.0
debug_recon_weight = 0.0

[augment]
image_size = 224
resize_short = 256
min_scale = 0.4
max_scale = 1.0
min_aspect_ratio = 0.75
max_aspect_ratio = 1.3333334
flip_prob = 0.5
color_jitter_prob = 0.8
brightness = 0.4
contrast = 0.4
saturation = 0.0
hue = 0.1
grayscale_prob = 0.0
blur_prob = 0.0
blur_sigma_min = 0.1
blur_sigma_max = 2.0
solarize_prob = 0.0
solarize_threshold = 128
normalize_mean = [0.485, 0.456, 0.406]
normalize_std = [0.229, 0.224, 0.225]
