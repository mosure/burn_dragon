[package]
name = "burn_dragon_hatchling"
description = "burn (baby) dragon hatchling inference and training"
version = "0.3.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = [
  "burn",
  "bdh",
  "language-model",
  "machine-learning",
]
categories = [
  "compression",
  "science",
  "science::neuroscience",
]
homepage = "https://github.com/mosure/burn_bdh"
repository = "https://github.com/mosure/burn_bdh"
readme = "README.md"
exclude = [
  ".devcontainer",
  ".github",
  "docs",
  "dist",
  "build",
  "assets",
  "credits",
]

[workspace]
members = [
  ".",
  "crates/burn_dragon_hatchling_core",
  "crates/burn_dragon_hatchling_cli",
  "crates/burn_dragon_hatchling_vision",
  "crates/foveation_viewer",
]


[features]
default = ["cli", "cuda"]

benchmark = ["burn_dragon_hatchling_core/benchmark", "burn_dragon_hatchling_vision/benchmark"]
cli = ["burn_dragon_hatchling_core/cli", "burn_dragon_hatchling_vision/cli"]
train = ["burn_dragon_hatchling_core/train", "burn_dragon_hatchling_vision/train"]
cuda = ["burn_dragon_hatchling_core/cuda", "burn_dragon_hatchling_vision/cuda"]
integration_test = [
  "burn_dragon_hatchling_core/integration_test",
  "burn_dragon_hatchling_vision/integration_test",
]
web = ["burn_dragon_hatchling_core/web"]
viz = ["burn_dragon_hatchling_core/viz"]


[dependencies]
burn_dragon_hatchling_core = { path = "crates/burn_dragon_hatchling_core", default-features = false }
burn_dragon_hatchling_vision = { path = "crates/burn_dragon_hatchling_vision", default-features = false }


[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
burn = { version = "0.19", default-features = false, features = ["fusion", "ndarray", "std", "wgpu"] }
burn-autodiff = { version = "0.19" }
burn-ndarray = "0.19"
burn-wgpu = { version = "0.19", default-features = false, features = ["fusion", "std"] }
burn-cuda = { version = "0.19", default-features = false, features = ["std"] }
bytemuck = { version = "1", features = ["derive"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tempfile = "3"
wgpu = "26"


[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.bench]
inherits = "release"
lto = "off"
codegen-units = 16
debug = 0

[profile.wasm-release]
strip = "symbols"
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"


[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bench]]
name = "inference"
harness = false
path = "bench/inference.rs"

[[bench]]
name = "train"
harness = false
path = "bench/train.rs"

[[bench]]
name = "vision_pipeline"
harness = false
path = "bench/vision_pipeline.rs"

[[bench]]
name = "vision_train_step"
harness = false
path = "bench/vision_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_mae_train_step"
harness = false
path = "bench/vision_mae_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_lejepa_train_step"
harness = false
path = "bench/vision_lejepa_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_input_projection"
harness = false
path = "bench/vision_input_projection.rs"
required-features = ["benchmark"]
