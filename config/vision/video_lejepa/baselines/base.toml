extends = ["../base/moving_mnist_pyramid.toml"]

[dataset]
max_records = 2048
prefetch_batches = 4
prefetch_workers = 4
prefetch_to_device = true

[training]
batch_size = 32
max_iters = 1000
log_frequency = 25
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 2

[optimizer]
weight_decay = 0.0

[vision]
pos_encoding = "learned2d"
steps = 8

[vision.trm_graph]
predict_coarse_substeps = 1

[mode]
train_target_frames_min = 2
train_target_frames_max = 6
train_target_warmup_steps = 200
artifact_every = 25
artifact_max_images = 2
artifact_future_frames = 24
artifact_upscale = 4
