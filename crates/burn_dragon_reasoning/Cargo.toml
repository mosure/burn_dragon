[package]
name = "burn_dragon_reasoning"
description = "Structured reasoning task and TTCL infrastructure for burn_dragon"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mosure/burn_bdh"
repository = "https://github.com/mosure/burn_bdh"
readme = "../../README.md"

[dependencies]
anyhow = "1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
burn_dragon_core = { path = "../burn_dragon_core", version = "0.5.0", default-features = false }

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]
