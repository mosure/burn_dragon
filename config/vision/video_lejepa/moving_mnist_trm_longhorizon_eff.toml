extends = ["base/moving_mnist_pyramid.toml"]

[dataset]
max_records = 16384
prefetch_batches = 8
prefetch_workers = 8
prefetch_to_device = false

[training]
batch_size = 128
epochs = 12
log_frequency = 64
enable_checkpoints = true
device_memory_check_every = 20
max_device_memory_mb = 32768
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 2

[optimizer]
weight_decay = 0.001

[mode]
target_frames = 6
train_target_frames_min = 2
train_target_frames_max = 6
train_target_warmup_steps = 1200
artifact_every = 12
artifact_max_images = 16
artifact_future_frames = 24
artifact_upscale = 2

[mode.temporal]
predict_backprop_frames = 6

[mode.loss]
probe_weight = 1.0
debug_recon_weight = 0.25

[mode.loss.sigreg]
lambda = 0.01
