extends = [
  "../../shared/current_best_large_dense_stack.toml",
]

[dataset]
cache_dir = "data/universality/runtime_large"
train_split_ratio = 0.9
type = "universality_nca"
config = "config/universality/nca_paper_aligned_medium.toml"

[dataset.tokenizer]
type = "pretokenized"
vocab_size = 50257
eos_id = 50256

[generation]
prompt = "0 0 0"
temperature = 1.0
top_k = 1

[training]
# Keep the NCA budget intentionally tiny.
# The transfer matrix showed NCA is only worth keeping as a small warm-start tax,
# not as a major equal-budget substitute for ClimbMix time.
max_iters = 4096
checkpoint_interval_iters = 1024
log_frequency = 64

[optimizer.lr_schedule]
type = "cosine"
min_lr = 0.00003
num_iters = 4096
