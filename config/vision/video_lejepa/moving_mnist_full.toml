extends = ["base/moving_mnist_cellular.toml"]

[dataset]
prefetch_batches = 8
prefetch_workers = 8
prefetch_to_device = true

[training]
batch_size = 128
epochs = 10
max_iters = 2500
log_frequency = 25
enable_checkpoints = true
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 2

[mode]
artifact_every = 10
artifact_max_images = 2
artifact_future_frames = 60
artifact_upscale = 4
artifact_overwrite = false
