extends = ["base/moving_mnist_pyramid.toml"]

[dataset]
max_records = 8
prefetch_batches = 2
prefetch_workers = 2
prefetch_to_device = true

[training]
batch_size = 8
epochs = 1
max_iters = 1
log_frequency = 1
enable_checkpoints = false
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 2

[optimizer]
weight_decay = 0.01

[mode]
train_target_frames_min = 2
train_target_frames_max = 6
train_target_warmup_steps = 40
artifact_every = 1
artifact_max_images = 1
artifact_future_frames = 12
artifact_upscale = 4

[mode.temporal]
predict_backprop_frames = 4
