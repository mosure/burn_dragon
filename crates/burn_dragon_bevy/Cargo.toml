[package]
name = "burn_dragon_bevy"
description = "Bevy visualization for burn_dragon"
version = "0.4.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mosure/burn_bdh"
repository = "https://github.com/mosure/burn_bdh"
readme = "../../README.md"

[features]
default = []
cli = []
viz = []

[dependencies]
burn = { version = "0.19", default-features = false, features = ["std", "wgpu"] }
burn-wgpu = { version = "0.19", default-features = false, features = ["fusion", "std"] }
bevy_burn = "0.4"
burn_dragon_core = { path = "../burn_dragon_core", version = "0.4.0", default-features = false, features = ["viz"] }

[dependencies.bevy]
version = "0.17"
default-features = false
features = [
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_gltf",
  "bevy_image",
  "bevy_log",
  "bevy_light",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_post_process",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "multi_threaded",
  "png",
  "x11",
  "zstd_rust",
]

[dev-dependencies]
burn-ndarray = "0.19"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
