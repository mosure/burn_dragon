# dataset type presets:
#   "shakespeare"  - tinyshakespeare character corpus
#   "deep_math"    - zwhe99/DeepMath-103K (Problem/Solution pairs)
#   "tiny_chat"    - starhopp3r/TinyChat BASIC-English conversations
#   "poetry_foundation" - suayptalha/Poetry-Foundation-Poems (Title + poem)
#   "webscale_rl"  - Salesforce/Webscale-RL parquet shards (RL QA data)
#   "hugging_face" - arbitrary Hugging Face dataset (see example below)

[dataset]
cache_dir = "data/shakespeare"
train_split_ratio = 0.9
# type options listed above
type = "shakespeare"

# example for a custom huggingface dataset override:
#
# [dataset]
# cache_dir = "data"
# train_split_ratio = 0.85
# type = "hugging_face"
# format = "parquet"        # or "jsonl" / "text" / "csv"
# repo_id = "zwhe99/DeepMath-103K"
# token = "hf_xxx"         # optional access token (overrides HF_TOKEN if set)
# revision = "main"         # optional ref (tag/branch/sha)
# train_files = ["data/train.parquet"]
# validation_files = ["data/validation.parquet"]
# text_fields = ["text"]
# max_records = 1024        # optional sampling cap for prototyping
# authentication uses dataset.token if set, otherwise falls back to HF_TOKEN or huggingface-cli login

[dataset.tokenizer]
# type accepts "char" (default) or "byte"
type = "char"
include_unknown = true
vocab_path = "vocab.json"

[training]
block_size = 512
batch_size = 24
seed = 1337
# Optimizer updates happen every `gradient_accumulation_steps` micro-batches.
gradient_accumulation_steps = 1
# Optional target for automatic effective-batch recovery.
# When set, the runtime derives gradient accumulation steps so the effective
# batch size approximates this target.
# When omitted, the configured `gradient_accumulation_steps` is used as-is,
# including after startup autotune shrinks the micro-batch.
# target_effective_batch_size = 64
max_iters = 3000
epochs = 30
# When set, training uses full epochs and derives max_iters and lr_schedule.num_iters
# from steps_per_epoch * epochs (training.max_iters is ignored).
log_frequency = 100
# Deprecated for language BDH.
# This flag no longer selects a distinct fast path; use
# `training.sequence_kernel_override` to choose the train-time kernel explicitly.
[optimizer]
learning_rate = 0.001
weight_decay = 0.1

[optimizer.lr_schedule]
# type variants: "constant", "cosine", "linear", "exponential", "step", "noam"
type = "cosine"
min_lr = 0.00005
num_iters = 6000

[generation]
prompt = "To be or "
temperature = 1.0
top_k = 3

[wgpu]
backend = "auto"
# tasks_max and memory tuning remain optional.

# Distributed/runtime planning surface.
# The language trainer remains single-device today, but Phase 0 now makes the
# future mesh intent explicit in configs and checkpoints.
#
# [parallel]
# mode = "single"            # single | ddp | fsdp | tensor_parallel_neuron | hybrid_2d
# world_size = 1
#
# [parallel.data]
# size = 1
# backend = "auto"           # auto | nccl | gloo
# find_unused_parameters = false
# gradient_as_bucket_view = true
#
# [parallel.tensor]
# size = 1
# axis = "neuron"
# partition = "contiguous"   # contiguous | head_aligned
# sequence_parallel = false
#
# [parallel.fsdp]
# enabled = false
# reshard_after_forward = false
# cpu_offload = false
# mixed_precision = "disabled"
#
# [parallel.checkpoint]
# format = "unsharded_v1"    # unsharded_v1 | sharded_v2
# async_write = false

[wgpu.training]
# Switches recurrent core implementation for language training on wgpu backends.
# false: burn tensor-core recurrent path
# true: fused burn_dragon_wgpu recurrent path
# Note: the language train CLI now routes `--backend wgpu` through the Cube
# backend automatically. On the current tiny-Shakespeare training path, the
# fused recurrent Cube path is the best measured default again. The non-fused
# path remains a useful fallback for A/B checks and for debugging experimental
# recurrent-state features such as y_neuron carry.
fused_core_recurrent = true
# Switches rollout executor when fused_core_recurrent is enabled.
# false: host-managed per-fast-step loop
# true: fused per-slow-step rollout executor (device-side fast inner steps)
# For language training, the current default keeps rollout fusion off.
# Multi-step rollout training with fast_steps > 1 is still an experimental path.
fused_core_rollout = false
# Optional startup batch-size probe for WGPU language training.
# When enabled, the current `training.batch_size` acts as the default upper bound
# unless `max_batch_size` is set explicitly.
#
# [wgpu.training.startup_autotune]
# enabled = true
# target_device_memory_mb = 8192
# min_batch_size = 8
# max_batch_size = 128
# probe_steps = 1
# binary_search = true

[wgpu.inference]
# Switches recurrent core implementation for language inference on wgpu backends.
# false: burn tensor-core recurrent path
# true: fused burn_dragon_wgpu recurrent path
fused_core_recurrent = true
# Switches rollout executor when fused_core_recurrent is enabled.
# false: host-managed per-fast-step loop
# true: fused per-slow-step rollout executor (device-side fast inner steps)
fused_core_rollout = false
# Stream executor for generation:
# "baseline": per-token host sampling/sync behavior.
# "rollout_chunked": greedy (top_k=1) device-side token buffering with chunked host flush.
generation_executor = "baseline"
# Number of generated tokens to flush to host per chunk when `generation_executor="rollout_chunked"`.
generation_chunk_tokens = 8
# Maximum generated tokens buffered on device before forced flush.
generation_device_buffer_tokens = 64

[model]
n_layer = 4
n_embd = 256
n_head = 4
mlp_internal_dim_multiplier = 4
# sequence kernel: "linear_attention" (default) or
# "rwkv8_state_space" for the decayed normalized
# recurrent kernel.
# sequence_kernel = "linear_attention"
# Training-only kernel override belongs under `[training]`.
# On CUDA short-context language training, plain `linear_attention` is
# auto-promoted to `{ memory_system = "linear_attention", executor =
# "dense_score_short_context" }` unless you set
# `training.sequence_kernel_override` explicitly.
# sequence_kernel_override = { memory_system = "linear_attention", executor = "dense_score_short_context" }
# Fast internal recurrent updates per emitted slow token.
# Supported values: 1, 2, 4, 8, 16.
rollout_fast_steps_per_slow_step = 1
# Paper default: standard ReLU threshold (0.0).
relu_threshold = 0.0
dropout = 0.1
fused_kernels = true
# block_size overrides fused-kernel tiling; if omitted, training.block_size is used.
# block_size = 512
# rotary embedding: "alibi" (default), "rope", or "pope"
rotary_embedding = "alibi"
