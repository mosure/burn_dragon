# CUDA launch overrides for denser full ImageNet-1k multimode spatial training.
# Keeps the effective batch size at 256 while increasing the true CUDA microbatch.

[dataset]
prefetch_batches = 4
prefetch_workers = 8
prefetch_to_device = true

[training]
batch_size = 64
gradient_accumulation_steps = 4
schedule_mode = "max_iters"
log_frequency = 25
device_memory_check_every = 10
max_device_memory_mb = 98304
