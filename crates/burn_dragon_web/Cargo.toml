[package]
name = "burn_dragon_web"
description = "Web/WASM interface for burn_dragon"
version = "0.4.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mosure/burn_bdh"
repository = "https://github.com/mosure/burn_bdh"
readme = "../../README.md"

[features]
default = []
viz = ["dep:bevy_dragon"]

[dependencies]
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
burn = { version = "0.19", default-features = false, features = ["std", "webgpu"] }
burn-wgpu = { version = "0.19", default-features = false, features = ["webgpu", "std"] }
burn_dragon_core = { path = "../burn_dragon_core", version = "0.4.0", default-features = false, features = ["web"] }
burn_dragon_language = { path = "../burn_dragon_language", version = "0.4.0", default-features = false, features = ["web"] }
bevy_dragon = { path = "../bevy_dragon", version = "0.4.0", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "HtmlElement",
  "Window",
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "ImageData",
  "Performance",
] }
