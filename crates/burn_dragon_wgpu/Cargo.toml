[package]
name = "burn_dragon_wgpu"
description = "Fused WGPU kernels for burn_dragon recurrent paths"
version = "0.4.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = ["burn", "wgpu", "kernel", "recurrent"]
categories = ["science", "science::neuroscience"]
readme = "../../README.md"

[features]
default = []

[dependencies]
burn = { version = "0.19", default-features = false, features = ["fusion", "ndarray", "std", "wgpu"] }
burn-autodiff = { version = "0.19", default-features = false }
burn-wgpu = { version = "0.19", default-features = false, features = ["fusion", "std", "template"] }
burn-cubecl = { version = "0.19", default-features = false, features = ["std", "fusion"] }
burn-fusion = { version = "0.19", default-features = false, features = ["std"] }
cubecl = { version = "0.8", default-features = true, features = ["std"] }
cubecl-runtime = { version = "0.8", default-features = true, features = ["channel-mpsc", "std"] }
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "26"

[dev-dependencies]
burn-ndarray = "0.19"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]
