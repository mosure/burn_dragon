[dataset]
cache_dir = "data/sudoku"
train_split_ratio = 0.9
type = "local"
root = "data/sudoku"
format = "jsonl"
train_files = ["train.jsonl"]
validation_files = []
puzzle_field = "puzzle"
solution_field = "solution"
max_records = 64

[training]
batch_size = 8
max_iters = 50
log_frequency = 10
rollout_steps = 4
halt_weight = 0.1
teacher_forcing_prob = 1.0
teacher_forcing_final = 1.0
teacher_forcing_anneal_steps = 0
policy_temperature = 1.0
policy_temperature_final = 1.0
policy_temperature_anneal_steps = 0
policy_noise = 0.02
revisit_min_filled_frac = 0.0
revisit_min_filled_final = 0.0
revisit_min_filled_anneal_steps = 0
reward_unknown_power = 0.0

[training.gdpo]
enabled = true
group_size = 2
hard_weight = 1.0
easy_weight = 1.0
policy_weight = 0.5
policy_clip_range = 0.2

[optimizer]
learning_rate = 0.001
weight_decay = 0.0

[model]
n_layer = 2
n_embd = 64
n_head = 2
mlp_internal_dim_multiplier = 2
dropout = 0.0

[artifacts]
output = "avi"
fps = 6
max_samples = 2
overwrite = true

