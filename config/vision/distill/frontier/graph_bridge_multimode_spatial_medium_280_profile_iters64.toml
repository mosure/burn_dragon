# Short profiling overlay for ImageNet-1k multimode spatial training.
# Purpose:
# - isolate kernel dispatch / metadata / host-sync stalls on the real dataset path
# - keep the model and teacher stack unchanged
# - finish quickly enough to support repeated A/B diagnosis

[training]
schedule_mode = "max_iters"
epochs = 1
max_iters = 64
log_frequency = 1
device_memory_check_every = 1
