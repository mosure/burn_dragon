extends = ["base/moving_mnist_pyramid.toml"]

[dataset]
max_records = 4096
prefetch_batches = 8
prefetch_workers = 8
prefetch_to_device = false

[training]
batch_size = 128
epochs = 8
log_frequency = 32
enable_checkpoints = false
device_memory_check_every = 10
max_device_memory_mb = 86000
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 2

[optimizer]
weight_decay = 0.001

[mode]
train_target_frames_min = 2
train_target_frames_max = 4
train_target_warmup_steps = 400
artifact_every = 8
artifact_max_images = 16
artifact_future_frames = 24
artifact_upscale = 2

[mode.temporal]
predict_backprop_frames = 2

[mode.loss]
probe_weight = 1.0
debug_recon_weight = 0.5

[mode.loss.sigreg]
lambda = 0.01
