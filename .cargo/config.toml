[target.wasm32-unknown-unknown]
# Intentionally leave the runner unset at the workspace level.
# Use `cargo run -p xtask -- wasm-smoke` for browser wasm tests, or set
# `CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER` explicitly per invocation.
rustflags = [
    "--cfg=web_sys_unstable_apis",
    "--cfg=getrandom_backend=\"wasm_js\"",
    # "-C",
    # "target-feature=+atomics,+bulk-memory,+mutable-globals",  # for wasm-bindgen-rayon
]


# fix spurious network error on windows
# [source.crates-io]
# registry = "https://github.com/rust-lang/crates.io-index"

[http]
proxy = ""


# offline development
# [source.crates-io]
# replace-with = "vendored-sources"

# [source.vendored-sources]
# directory = "vendor"
