extends = ["../../shared/current_best_large_dense_stack.toml"]

[dataset]
cache_dir = "data/nemotron_climbmix"
train_split_ratio = 0.9
type = "nemotron_climb_mix"

[dataset.tokenizer]
type = "pretokenized"
vocab_size = 50257
eos_id = 50256

[dataset.validation]
cache_dir = "data/openwebtext_gpt2_validation"
train_split_ratio = 0.999
type = "openwebtext_gpt2"
max_records = 2048

[training]
# Dense-score remains the promoted operational executor on the large staged line.
# The tuned Mamba contender uses the sibling current_best_large_mamba_contender baseline.
checkpoint_interval_iters = 2000
log_frequency = 100
# Base large stage keeps the proven 24h rung. Longer baselines extend this file
# and only override the wall-clock budget knobs below.
max_iters = 70000

[optimizer.lr_schedule]
type = "cosine"
min_lr = 0.00003
num_iters = 70000

[generation]
prompt = "The"
temperature = 0.9
top_k = 40
output_format = "decoded_text"

[generation.prompt_tokenizer]
source = "config"
cache_dir = "data/tokenizers/gpt2"
type = "rust_bpe"
vocab_path = "tokenizer.json"
mergeable_vocab_size = 50256
eos_id = 50256

[generation.decode_tokenizer]
source = "config"
cache_dir = "data/tokenizers/gpt2"
type = "rust_bpe"
vocab_path = "tokenizer.json"
mergeable_vocab_size = 50256
eos_id = 50256
