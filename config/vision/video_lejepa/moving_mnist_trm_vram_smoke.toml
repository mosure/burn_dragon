extends = ["base/moving_mnist_pyramid.toml"]

[dataset]
max_records = 512
prefetch_batches = 4
prefetch_workers = 4
prefetch_to_device = true

[training]
batch_size = 128
epochs = 4
log_frequency = 4
enable_checkpoints = false
device_memory_check_every = 1
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 2

[optimizer]
weight_decay = 0.01

[mode]
train_target_frames_min = 2
train_target_frames_max = 2
train_target_warmup_steps = 0
artifact_every = 1
artifact_max_images = 16
artifact_future_frames = 24
artifact_upscale = 2
