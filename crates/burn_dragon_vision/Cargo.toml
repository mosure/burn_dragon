[package]
name = "burn_dragon_vision"
description = "Foveation and vision sampling utilities for burn dragon"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = ["vision", "foveation", "sampling", "burn"]
categories = ["science", "science::neuroscience"]
homepage = "https://github.com/mosure/burn_bdh"
repository = "https://github.com/mosure/burn_bdh"
readme = "../../README.md"

[features]
default = []

benchmark = ["train", "burn_dragon_core/benchmark", "burn_dragon_train/benchmark"]
cli = ["train", "dep:clap", "dep:ctrlc", "burn_dragon_train/cli"]
train = [
  "dep:burn_dragon_checkpoint",
  "burn_dragon_core/train",
  "burn_dragon_train/train",
  "dep:anyhow",
  "dep:burn-autodiff",
  "dep:burn-dataset",
  "dep:burn-ndarray",
  "dep:burn-train",
  "dep:burn-wgpu",
  "dep:burn-cubecl",
  "dep:burn-fusion",
  "dep:burn-ir",
  "dep:cubecl",
  "dep:names",
  "dep:toml",
  "dep:ureq",
  "dep:hf-hub",
  "dep:csv",
  "dep:parquet",
  "dep:tracing",
  "dep:image",
  "dep:flate2",
  "dep:tar",
  "dep:serde_json",
  "dep:serde_yaml",
  "dep:rand",
  "dep:burn_dragon_train",
]
cuda = ["dep:burn-cuda", "burn_dragon_core/cuda", "burn_dragon_train/cuda"]
integration_test = ["train", "burn_dragon_train/integration_test"]

[dependencies]
burn_dragon_checkpoint = { path = "../burn_dragon_checkpoint", version = "0.5.0", default-features = false, optional = true }
burn_dragon_core = { path = "../burn_dragon_core", version = "0.5.0", default-features = false }
burn_dragon_kernel = { path = "../burn_dragon_kernel", version = "0.5.0", default-features = false }
burn_dragon_train = { path = "../burn_dragon_train", version = "0.5.0", default-features = false, optional = true }
anyhow = { version = "1", optional = true }
burn = { version = "0.21.0-pre.3", default-features = false, features = ["fusion", "ndarray", "std", "wgpu"] }
burn-autodiff = { version = "0.21.0-pre.3", optional = true }
burn-dataset = { version = "0.21.0-pre.3", optional = true, features = ["vision"] }
burn-ndarray = { version = "0.21.0-pre.3", optional = true }
burn-train = { version = "0.21.0-pre.3", optional = true, default-features = false }
burn-wgpu = { version = "0.21.0-pre.3", default-features = false, optional = true, features = ["fusion", "std", "template"] }
burn-cubecl = { version = "0.21.0-pre.3", default-features = false, optional = true, features = ["std", "fusion"] }
burn-fusion = { version = "0.21.0-pre.3", default-features = false, optional = true, features = ["std"] }
burn-ir = { version = "0.21.0-pre.3", optional = true }
burn-cuda = { version = "0.21.0-pre.3", optional = true, default-features = false, features = ["std"] }
cubecl = { version = "0.10.0-pre.3", default-features = true, optional = true, features = ["std"] }
names = { version = "0.14", optional = true }
toml = { version = "0.9", optional = true }
ureq = { version = "2.9", features = ["tls"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
csv = { version = "1.3", optional = true }
parquet = { version = "53", optional = true }
tracing = { version = "0.1", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
flate2 = { version = "1.1", optional = true }
tar = { version = "0.4", optional = true }
burn_dino = { version = "0.7", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.4", optional = true }
half = "2"

[[bin]]
name = "train"
path = "src/bin/train.rs"
required-features = ["cli"]

[dev-dependencies]
bytemuck = { version = "1", features = ["derive"] }
burn-autodiff = "0.21.0-pre.3"
burn_dragon_language = { path = "../burn_dragon_language", version = "0.5.0", default-features = false, features = ["train"] }
burn-ndarray = { version = "0.21.0-pre.3" }
criterion = { version = "0.7", features = ["html_reports"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "0.3"
tempfile = "3"
wgpu = "26"

[[bench]]
name = "vision_pipeline"
harness = false
path = "benches/vision_pipeline.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_train_step"
harness = false
path = "benches/vision_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_mae_train_step"
harness = false
path = "benches/vision_mae_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_lejepa_train_step"
harness = false
path = "benches/vision_lejepa_train_step.rs"
required-features = ["benchmark"]

[[bench]]
name = "vision_input_projection"
harness = false
path = "benches/vision_input_projection.rs"
required-features = ["benchmark"]
