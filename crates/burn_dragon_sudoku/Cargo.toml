[package]
name = "burn_dragon_sudoku"
description = "Sudoku datasets and training for burn_dragon"
version = "0.4.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mosure/burn_bdh"
repository = "https://github.com/mosure/burn_bdh"
readme = "../../README.md"

[features]
default = []
cli = ["train", "dep:clap", "dep:burn-wgpu"]
train = [
  "burn/dataset",
  "burn_dragon_core/train",
  "burn_dragon_train/train",
  "dep:burn-autodiff",
  "dep:burn-ndarray",
  "dep:burn-train",
  "dep:toml",
  "dep:hf-hub",
  "dep:csv",
  "dep:parquet",
  "dep:tracing",
]
cuda = ["burn-cuda", "burn_dragon_core/cuda", "burn_dragon_train/cuda", "dep:cubecl"]
integration_test = ["train"]

[dependencies]
burn_dragon_core = { path = "../burn_dragon_core", version = "0.4.0", default-features = false }
burn_dragon_train = { path = "../burn_dragon_train", version = "0.4.0", default-features = false, optional = true }

anyhow = "1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.9", optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
csv = { version = "1.3", optional = true }
parquet = { version = "53", optional = true }
tracing = { version = "0.1", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

burn = { version = "0.19", default-features = false, features = ["fusion", "ndarray", "std", "wgpu"] }
burn-autodiff = { version = "0.19", optional = true }
burn-ndarray = { version = "0.19", optional = true }
burn-train = { version = "0.19", optional = true, default-features = false, features = ["tui"] }
burn-cuda = { version = "0.19", optional = true, default-features = false, features = ["std"] }
burn-wgpu = { version = "0.19", optional = true, default-features = false, features = ["fusion", "std"] }
cubecl = { version = "0.8", default-features = false, optional = true, features = ["std", "cuda"] }

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "train"
path = "src/bin/train.rs"
required-features = ["cli"]
