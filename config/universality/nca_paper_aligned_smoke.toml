name = "nca_paper_aligned_smoke"
output_dir = "data/universality/nca_paper_aligned_smoke"
seed = 1337
train_samples = 32
validation_samples = 8
chunk_token_capacity = 16384

[serialization]
patch_size = 2
include_observable_header = true
preview_samples = 6

[tokenization]
type = "patch_token_ids"
vocab_size = 50257
eos_id = 50256

[[families]]
kind = "neural_stochastic"
weight = 1
complexity = "simple"
grid_size = { min = 12, max = 12 }
steps = { min = 10, max = 10 }
state_count = { min = 10, max = 10 }
step_stride = { min = 2, max = 2 }
start_step = { min = 0, max = 0 }
identity_bias = { min = 0.0, max = 0.0 }
temperature = { min = 0.0, max = 0.0 }
rule_filter = { metric = "gzip", threshold = 0.0, upper_bound = 0.30, max_attempts = 256 }

[[families]]
kind = "neural_stochastic"
weight = 1
complexity = "medium"
grid_size = { min = 12, max = 12 }
steps = { min = 10, max = 10 }
state_count = { min = 10, max = 10 }
step_stride = { min = 2, max = 2 }
start_step = { min = 0, max = 0 }
identity_bias = { min = 0.0, max = 0.0 }
temperature = { min = 0.0, max = 0.0 }
rule_filter = { metric = "gzip", threshold = 0.30, upper_bound = 0.50, max_attempts = 256 }

[[families]]
kind = "neural_stochastic"
weight = 1
complexity = "complex"
grid_size = { min = 12, max = 12 }
steps = { min = 10, max = 10 }
state_count = { min = 10, max = 10 }
step_stride = { min = 2, max = 2 }
start_step = { min = 0, max = 0 }
identity_bias = { min = 0.0, max = 0.0 }
temperature = { min = 0.0, max = 0.0 }
