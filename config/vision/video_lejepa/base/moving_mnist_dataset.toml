[dataset]
source = "moving_mnist"

[dataset.moving_mnist]
digit_size = 20
min_velocity = 0.8
max_velocity = 2.0
train_seed = 1337
val_seed = 7331

[augment]
image_size = 32
resize_short = 32
min_scale = 1.0
max_scale = 1.0
min_aspect_ratio = 1.0
max_aspect_ratio = 1.0
flip_prob = 0.0
color_jitter_prob = 0.0
brightness = 0.0
contrast = 0.0
saturation = 0.0
hue = 0.0
grayscale_prob = 0.0
blur_prob = 0.0
blur_sigma_min = 0.1
blur_sigma_max = 2.0
solarize_prob = 0.0
solarize_threshold = 128
