# Tuned fused WGPU launch overrides for full ImageNet-1k multimode spatial training.
# Purpose:
# - search one step above the conservative diagnostic launch
# - remain well below the startup allocation failures seen at batch sizes 24 and 32

[dataset]
prefetch_batches = 1
prefetch_workers = 8
prefetch_to_device = false

[training]
batch_size = 20
gradient_accumulation_steps = 13
log_frequency = 12
device_memory_check_every = 2
max_device_memory_mb = 98304

[vision]
fused_kernels = true

[wgpu.training]
fused_core_recurrent = true
fused_core_rollout = true
