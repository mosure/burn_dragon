extends = ["../../base.toml"]

[dataset]
max_records = 4096

[training]
batch_size = 8
schedule_mode = "max_iters"
epochs = 1
max_iters = 12
log_frequency = 2
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 1

[optimizer.lr_schedule]
type = "constant"

[vision]
embed_dim = 48
steps = 2
n_head = 3
projection_dim = 64
projection_hidden_dim = 128

[vision.rho_stream]
enabled = true
local_radius = 1
local_diagonals = true
local_self = true
decay = 0.985
mode_embeddings = true
wgpu_forward_kernel = false
wgpu_rollout_fused = false

[mode]
sample_steps = 4
random_time_grid = true
velocity_hidden_dim = 64
artifact_output = "images"
artifact_every = 1
artifact_max_images = 4
artifact_upscale = 2

[mode.memory]
observe_steps = 1
backprop_steps = 1
reset_each_step = false
