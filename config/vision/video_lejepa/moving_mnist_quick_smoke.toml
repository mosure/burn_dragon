extends = ["base/moving_mnist_cellular.toml"]

[dataset]
max_records = 8
prefetch_batches = 1
prefetch_workers = 1
prefetch_to_device = true

[training]
batch_size = 2
epochs = 1
max_iters = 2
log_frequency = 1
enable_checkpoints = false
rollout_min_steps = 2
rollout_max_steps = 2
rollout_backprop_steps = 2

[mode]
artifact_every = 1
artifact_max_images = 1
artifact_future_frames = 12
artifact_upscale = 4
