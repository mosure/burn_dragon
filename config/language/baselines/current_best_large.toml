# Promoted operational large language bundle.
# This remains the dense-score line because it is the only full staged bundle that has already
# been proven end-to-end on the streaming-TBPTT + NCA-warm-start regime.
# The matching large BitNet contender is kept as a sibling bundle rather than replacing this one.
name = "current_best_large_48h"
output_dir = "runs/language_bundles/current_best_large"
resume_from_last_completed_stage = true

[[stages]]
# Expected wall-clock with the measured release CUDA on-the-fly NCA large rung:
# ~1.3-1.5 hours, plus a small stage handoff.
name = "nca_prepretrain"
type = "language_train"
config = "current_best_large/nca_stage_base.toml"
backend = "cuda"
launch_mode = "resume_latest_checkpoint_if_present"
[[stages]]
# Expected wall-clock with the promoted large ClimbMix rung:
# roughly ~48h end to end on the current dense-score batch12/block256 geometry.
name = "climbmix_pretrain"
depends_on = ["nca_prepretrain"]
type = "language_train"
config = "current_best_large/climbmix_stage_48h.toml"
backend = "cuda"
init_checkpoint_from_stage = "nca_prepretrain"
launch_mode = "resume_latest_checkpoint_if_present"
