# Memory-safe WGPU launch overrides for base-width ImageNet-1k multimode spatial training.
# Base 336 is substantially heavier than medium 280, so this keeps a conservative microbatch.

[dataset]
prefetch_batches = 1
prefetch_workers = 6
prefetch_to_device = false

[training]
batch_size = 8
gradient_accumulation_steps = 32
log_frequency = 25
device_memory_check_every = 5
max_device_memory_mb = 98304
