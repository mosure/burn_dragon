[package]
name = "burn_autogaze"
description = "AutoGaze-style fixation traces and teacher hooks for burn dragon"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
burn = { version = "0.21.0-pre.2", default-features = false, features = ["fusion", "ndarray", "std", "wgpu"] }
burn-store = { version = "0.21.0-pre.2", features = ["pytorch", "safetensors", "std"] }
half = "2"
safetensors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
burn-ndarray = "0.21.0-pre.2"
tempfile = "3"
