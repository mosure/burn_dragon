[package]
name = "burn_dragon_cli"
version = "0.4.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
description = "CLI for burn_dragon"
default-run = "infer"

[features]
default = ["cli", "cuda"]
cli = ["train", "burn_dragon/cli"]
train = ["burn_dragon/train", "dep:burn_dragon_sudoku", "burn_dragon_sudoku/train"]
cuda = ["dep:burn-cuda", "burn_dragon/cuda", "burn_dragon_sudoku/cuda"]
viz = ["burn_dragon/viz", "dep:ctrlc", "dep:bevy_burn"]
web = ["burn_dragon/web"]
benchmark = ["burn_dragon/benchmark"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
burn = { version = "0.21.0-pre.2", default-features = false, features = ["ndarray", "std", "wgpu", "fusion"] }
burn-autodiff = "0.21.0-pre.2"
burn-wgpu = { version = "0.21.0-pre.2", default-features = false, features = ["fusion", "std"] }
burn-ndarray = "0.21.0-pre.2"
bevy_burn = { version = "0.4", optional = true }
ctrlc = { version = "3.4", optional = true }
burn-cuda = { version = "0.21.0-pre.2", optional = true, default-features = false, features = ["std"] }
burn_dragon = { path = "../..", version = "0.4.0", default-features = false }
burn_dragon_wgpu = { path = "../burn_dragon_wgpu", version = "0.4.0", default-features = false }
burn_dragon_sudoku = { path = "../burn_dragon_sudoku", version = "0.4.0", default-features = false, optional = true }
pollster = "0.3"
wgpu = "26"

[[bin]]
name = "core_mhc_bench"
path = "src/bin/core_mhc_bench.rs"
required-features = ["benchmark"]

[[bin]]
name = "core_mhc_fb_bench"
path = "src/bin/core_mhc_fb_bench.rs"
required-features = ["benchmark"]

[[bin]]
name = "multimodal_vl_jepa_bench"
path = "src/bin/multimodal_vl_jepa_bench.rs"
required-features = ["benchmark"]
